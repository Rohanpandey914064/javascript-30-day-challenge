// JavaScript30 – Day 4: Array Cardio Day 1

// 1. Filter the list of inventors for those who were born in the 1500's
const fifteen = inventors.filter(inventor => inventor.year >= 1500 && inventor.year < 1600);
console.table(fifteen);

// 2. Give us an array of the inventors' first and last names
const fullName = inventors.map(inventor => inventor.first+" "+ inventor.last);
console.log(fullName);
// 3. Sort the inventors by birthdate, oldest to youngest
/*const birthOrder = inventors.sort(function(a,b) {

});*/

const birthOrder = inventors.sort((a,b) => a.year > b.year ? 1:-1);
console.table(birthOrder);

// 4. How many years did all the inventors live all together?

const yearLive = inventors.reduce((total, inventor) => {
    return total + (inventor.passed - inventor.year);
},0);
console.log(yearLive);


// 5. Sort the inventors by years lived

const oldestPeople = inventors.sort((a,b) => (a.passed - a.year)>(b.passed - b.year)? -1:1 );
console.table(oldestPeople);

// 6. Sort the people alphabetically by last name
const alpha = people.sort(function(Last , Next) {
const [aLast,aNext] = Last.split(", ");
const [bLast,bNext] = Next.split(", ");

return aLast > bLast ? -1:1;
});
console.log(alpha);

// 7. Sum up the instances of each of these
const data = [
  'car', 'car', 'truck', 'truck', 'bike', 'walk',
  'car', 'van', 'bike', 'walk', 'car', 'van',
  'car', 'truck'
];

const transpotation = data.reduce((obj,item) => {
    if(!obj[item]){
        obj[item] = 0;
    }
    obj[item] ++;
    return obj;
},{});
