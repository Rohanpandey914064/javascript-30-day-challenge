<!DOCTYPE html>
<html lang="en">

<body>
    <h1>JavaScript30 Day 7: Array Cardio</h1>
    <p>Open the browser console to see the results.</p>

    <script>
        const people = [
            {name: "rohan",year: 2005},
            {name: "shivam",year: 2004},
            {name: "Atul",year: 2007},
            {name: "Ayush",year: 2003}
        ];

        const comments = [
            { text: 'Love this!', id: 523423 },
            { text: 'Super good', id: 823423 },
            { text: 'You are the best', id: 2039842 },
            { text: 'Ramen is my fav food ever', id: 123523 },
            { text: 'Nice Nice Nice!', id: 542328 }
        ];

        //1. Is there at least one person in the people array who is 19 years old or older?
        /*const isAdult = people.some(function (person){
            const currentyear = (new date()).getFullYear();
            if(currentyear - person.year >=19){
                return true;
            }
        })*/

        const isAdult = people.some(person => ((new Date()).getFullYear()) - person.year >= 19 );

        console.log(isAdult);

        //2. Is everyone in the people array 19 years old or older?
        const AllAdult = people.every(person => ((new Date()).getFullYear()) - person.year >= 19 );
        console.log(AllAdult);

        //3. Find the comment object with the ID 823423 in the comments array.

        /*const comment = comments.find(function(comment) {
            if(comment.id === 823423){
                return true;
            }
        });*/

        const comment = comments.find(comment => comment.id === 823423);
        console.log(comment);

        //4. Find the index of the comment with the ID 823423.

        const index = comments.findIndex( comment => comment.id === 823423);
        console.log(index);

        //5. Delete the comment with the ID 823423 without mutating the original comments array.

        const newcomments = [
            ...comments.slice(0,index),
            ...comments.slice(index + 1)
        ];

        console.table(newcomments);
        console.table(comments)

    </script>
</body>
</html>
