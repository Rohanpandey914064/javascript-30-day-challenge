<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 17</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #ffc600;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        ul{
            list-style: inside square;
            font-size: 20px;
            background: white;
            width: 400px;
            padding: 20px;
            box-shadow: 0 0 0 10px rgba(0, 0, 0, 0.05);
        }

        li{
            border-bottom: 1px solid #efefef;
            padding: 10px 0;
        }

        li:last-child{
            border-bottom: 0;
        }
    </style>
</head>
<body>
    <ul id="bands"></ul>

    <script>
        const bands = [
            'The Plot in You',
            'The Devil Wears Prada',
            'Pierce the Veil',
            'Norma Jean',
            'The Bled',
            'Say Anything',
            'The Midway State',
            'We Came as Romans',
            'Counterparts',
            'Oh, Sleeper',
            'A Skylit Drive',
            'Anywhere But Here',
            'An Old Dog'
        ];
        function strip(bandName) {
            return bandName.replace(/^(a |the |an )/i,'').trim();
        }

        const sortedBands = bands.sort((a,b) => strip(a) > strip(b) ? 1 : -1);

        document.querySelector('#bands').innerHTML = 
                sortedBands.map(band => `<li>${band}</li>`).join('');
        console.log(sortedBands);
    </script>
</body>
</html>
