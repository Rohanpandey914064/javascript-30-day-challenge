<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>day 5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+NZ+Basic:wght@100..400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="panels">
        <div class="panel panel1">
            <p>Hey</p>
            <p>Let's</p>
            <p>Dance</p>
        </div>
        <div class="panel panel2">
            <p>Life</p>
            <p>In</p>
            <p>Motion</p>
        </div>
        <div class="panel panel3">
            <p>Give</p>
            <p>All</p>
            <p>You can</p>
        </div>
        <div class="panel panel4">
            <p>Experience</p>
            <p>It</p>
            <p>Today</p>
        </div>
        <div class="panel panel5">
            <p>Give</p>
            <p>Take's</p>
            <p>Receive</p>
        </div>
    </div>
    <style>
        html {
            box-sizing: border-box;
            background: #ffc600;
            font-family: "Playwrite NZ Basic", cursive;
            font-size: 20px;
            font-weight: 200;
        }

        body {
            margin: 0;
        }

        .panels {
            min-height: 100vh;
            overflow: hidden;
            display: flex;
        }

        .panel {
            background: #6b0f9c;
            box-shadow: inset 0 0 0 5px rgba(255, 255, 255, 0.1);
            color: white;
            text-align: center;
            align-items: center;
            transition: 
            font-size 0.7s cubic-bezier(0.61, -0.19, 0.7, -0.11),
            flex 0.7s cubic-bezier(0.61, -0.19, 0.7, -0.11),
            background 0.2s;
            font-size: 20px;
            background-size: cover;
            background-position: center;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .panel1{background-image: url(photo1.jpg);}
        .panel2{background-image: url(photo2.jpg);}
        .panel3{background-image: url(photo3.webp);}
        .panel4{background-image: url(photo4.webp);}
        .panel5{background-image: url(Photo5.avif);}

        .panel > *{
            margin: 0;
            width: 100%;
            transition: transform 0.5s;
            flex: 1 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel > *:first-child{transform: translateY(-100%);}
        .panel.open-active > *:first-child{transform: translateY(0)}
        .panel > *:last-child{transform: translateY(100%);}
        .panel.open-active > *:last-child{transform: translateY(0)}

        .panel p{
            text-transform: uppercase;
            font-family: 'Amatic sc' ,cursive;
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.72), 0 0 14px rgba(0, 0, 0, 0.45);
            font-size: 2em;
        }

        .panel p:nth-child(2) {
            font-size: 4em;
        }

        .panel.open {
            flex: 5;
            font-size: 40px;
        }

        .cta {
            color: white;
            text-decoration: none;
        }
    </style>

    <script>
        const panels = document.querySelectorAll('.panel');

        function toggleOpen() {
            console.log('Hello');
            this.classList.toggle('open');
        }

        function toggleActive(e) {
            console.log(e.propertyName);
            if(e.propertyName.includes('flex')) {
                this.classList.toggle('open-active');
            }
        }

        panels.forEach(panel => panel.addEventListener('click', toggleOpen));
        panels.forEach(panel => panel.addEventListener('transitionend',toggleActive));
    </script>
</body>
</html>
