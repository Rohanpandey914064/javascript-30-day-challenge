<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day-1</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="keys">
        <div data-key="65" class="key">
            <kbd>A</kbd>
            <span class="sound">dr-tom</span>
        </div>
        <div data-key="83" class="key">
            <kbd>s</kbd>
            <span class="sound">jump</span>
        </div>
        <div data-key="68" class="key">
            <kbd>D</kbd>
            <span class="sound">l1</span>
        </div>
        <div data-key="70" class="key">
            <kbd>F</kbd>
            <span class="sound">l2</span>
        </div>
        <div data-key="71" class="key">
            <kbd>G</kbd>
            <span class="sound">meow</span>
        </div>
        <div data-key="72" class="key">
            <kbd>H</kbd>
            <span class="sound">reaction</span>
        </div>
        <div data-key="74" class="key">
            <kbd>J</kbd>
            <span class="sound">scream</span>
        </div>
        <div data-key="75" class="key">
            <kbd>K</kbd>
            <span class="sound">suara</span>
        </div>
        <div data-key="76" class="key">
            <kbd>L</kbd>
            <span class="sound">vocal</span>
        </div>

        <audio data-key="65" src="sound/dr-tom.mp3"></audio>
        <audio data-key="83" src="sound/jump.mp3"></audio>
        <audio data-key="68" src="sound/laughing1.mp3"></audio>
        <audio data-key="70" src="sound/laughing2.mp3"></audio>
        <audio data-key="71" src="sound/meow.mp3"></audio>
        <audio data-key="72" src="sound/reaction.mp3"></audio>
        <audio data-key="74" src="sound/scream.mp3"></audio>
        <audio data-key="75" src="sound/suara.mp3"></audio>
        <audio data-key="76" src="sound/vocal.mp3"></audio>
        
        <script src="script.js"></script>
    </div>
</body>
</html>
